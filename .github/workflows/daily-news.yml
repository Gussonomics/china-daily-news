name: 🇨🇳 China Daily News

# ตัวตั้งเวลาจริงคือ automation ข้างนอก
# ที่ยิง workflow_dispatch ทุกวัน 08:17 น. เวลาไทย
# cron ข้างล่างเป็นแค่สำรอง: GitHub ไม่เคยสร้าง schedule run ให้ repo นี้
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
    - cron: '47 1 * * *'

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 ดาวน์โหลดโค้ด
      uses: actions/checkout@v4

    - name: 📅 วันที่ไทย
      id: date
      run: echo "day=$(TZ=Asia/Bangkok date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: 🧰 เช็กว่าส่งวันนี้ไปแล้วหรือยัง
      id: sent
      uses: actions/cache/restore@v4
      with:
        path: .sent-today
        key: china-daily-${{ steps.date.outputs.day }}

    - name: 🐍 ติดตั้ง Python
      if: steps.sent.outputs.cache-hit != 'true'
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 ติดตั้ง library
      if: steps.sent.outputs.cache-hit != 'true'
      run: pip install -r requirements.txt

    - name: 🤖 รันบอทสรุปข่าว
      if: steps.sent.outputs.cache-hit != 'true'
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: python src/bot.py

    - name: ✅ จดจำว่าส่งวันนี้แล้ว
      if: success() && steps.sent.outputs.cache-hit != 'true'
      run: date -u > .sent-today

    - name: 💾 เก็บ marker ไม่ให้ส่งซ้ำวันเดียว
      if: success() && steps.sent.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .sent-today
        key: china-daily-${{ steps.date.outputs.day }}

    - name: ⏭️ ข้ามถ้าส่งไปแล้ววันนี้
      if: steps.sent.outputs.cache-hit == 'true'
      run: echo "Already sent on ${{ steps.date.outputs.day }}, skipping."

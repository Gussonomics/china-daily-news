name: 🇨🇳 China Daily News

on:
  # รันทุกวัน 8:00 น. เวลาไทย (01:00 UTC)
  schedule:
    - cron: '0 1 * * *'
  
  # อนุญาตให้รัน manual
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 ดาวน์โหลดโค้ด
      uses: actions/checkout@v4
    
    - name: 🐍 ติดตั้ง Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 📦 ติดตั้ง library
      run: |
        pip install -r requirements.txt
    
    - name: 🤖 รันบอทสรุปข่าว
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: |
        python src/bot.py
    
    - name: ✅ แจ้งผลสำเร็จ
      if: success()
      run: echo "✅ ส่งข่าวสำเร็จ! $(date)"
    
    - name: ❌ แจ้งข้อผิดพลาด
      if: failure()
      run: echo "❌ ล้มเหลว! $(date)"

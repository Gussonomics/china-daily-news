name: 🇨🇳 China Daily News

on:
  schedule:
    # รันทุกวัน 08:17 น. เวลาไทย — เลื่อนออกจากนาทีที่ 0
    - cron: '17 8 * * *'
      timezone: Asia/Bangkok
    # ทดสอบ schedule ครั้งเดียว: 09:47 น. วันที่ 8 ต.ค. เท่านั้น ไม่ซ้ำทุกวัน
    - cron: '47 9 8 10 *'
      timezone: Asia/Bangkok

  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 ดาวน์โหลดโค้ด
      uses: actions/checkout@v4

    - name: 🐍 ติดตั้ง Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 ติดตั้ง library
      run: |
        pip install -r requirements.txt

    - name: 🤖 รันบอทสรุปข่าว
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: |
        python src/bot.py

    - name: ✅ แจ้งผลสำเร็จ
      if: success()
      run: echo "✅ ส่งข่าวสำเร็จ! $(date)"

    - name: ❌ แจ้งข้อผิดพลาด
      if: failure()
      run: echo "❌ ล้มเหลว! $(date)"
